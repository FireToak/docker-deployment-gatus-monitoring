endpoints:
  # GROUPE : SITES INTERNET
  - name: "Site Vitrine"
    group: "Sites Internet"
    url: "https://www.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "Portfolio"
    group: "Sites Internet"
    url: "https://louis.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  - name: "Documentation"
    group: "Sites Internet"
    url: "https://docs.loutik.fr"
    interval: 5m
    conditions:
      - "[STATUS] == 200"

  # GROUPE : COMPUTE (HYPERVISEURS)
  - name: "Gideon (PVE01)"
    group: "Compute"
    url: "https://pve-gideon.loutik.fr"
    display-name: "Hyperviseur Principal"
    client:
      dns-resolver: "tcp://192.168.1.204:53"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  - name: "Darlene (PVE02)"
    group: "Compute"
    url: "https://pve-darlene.loutik.fr"
    display-name: "Hyperviseur Secondaire"
    client:
      dns-resolver: "tcp://192.168.1.204:53"
    interval: 10s
    conditions:
      - "[STATUS] == 200"

  # GROUPE : SÉCURITÉ & CORE
  - name: "SSO Authentik"
    group: "Sécurité"
    url: "https://sso.loutik.fr"
    interval: 1m
    conditions:
      - "[STATUS] == 200"

  # GROUPE : OUTILS COLLABORATIFS
  - name: "Outline (Notes)"
    group: "Outils Collaboratifs"
    url: "https://notes.loutik.fr"
    interval: 2m
    conditions:
      - "[STATUS] == 200"

  # GROUPE : SERVICES & UTILITAIRES
#  - name: "Bot Discord PLC"
#    group: "Services"
#    url: "http://192.168.1.215:80"
#    display-name: "PLC Bot Instance"
#    interval: 1m
#    conditions:
#      - "[STATUS] == 200"

  - name: "Speedtest"
    group: "Services"
    url: "https://speedtest.loutik.fr"
    interval: 10m
    conditions:
      - "[STATUS] == 200"