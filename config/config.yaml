storage:
  type: sqlite
  path: /config/data.db

ui:
  title: "LoutikCLOUD - Statut"
  header: "LoutikCLOUD"
  dashboard-heading: "État des Services"
  dashboard-subheading: "Monitoring temps réel des plateformes LoutikCLOUD"
  logo: "https://raw.githubusercontent.com/firetoak/medias/main/logo/logo_loutik-health.png"
  favicon.default: https://raw.githubusercontent.com/firetoak/medias/main/logo/logo_loutik-health.png

announcements:
#  - timestamp: 2025-11-07T14:00:00Z
#    type: outage
